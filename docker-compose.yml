name: hackathon

x-database-env: &database-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-fsp}
  PGPASSWORD: ${POSTGRES_PASSWORD:-fsp_dev_password}
  PGDATABASE: ${POSTGRES_DB:-fsp}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
    volumes:
      - fsp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  init:
    build:
      context: .
      target: init
    environment:
      <<: *database-env
      NODE_ENV: development
      SEED_DEMO: ${DOCKER_SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      <<: *database-env
      NODE_ENV: production
      API_PORT: "4000"
      WEB_ORIGIN: ${DOCKER_PUBLIC_URL:-http://localhost:3000}
      PUBLIC_WEB_URL: ${DOCKER_PUBLIC_URL:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      OIDC_ISSUER: ${DOCKER_PUBLIC_URL:-http://localhost:3000}/api/oidc
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/disciplines').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

volumes:
  fsp_pg_data:
